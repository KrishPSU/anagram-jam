<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#232526">
  <meta name="description" content="Unscramble words for as long as you like. No clock, no score - and if you're stuck, it shows you the word.">
  <title>Practice | Anagram Jam</title>

  <!-- Favicon (browsers cache these hard - bump ?v= whenever the icon changes) -->
  <link rel="icon" type="image/png" href="/icon-192.png?v=2">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/icon-192.png?v=2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Solo mode's word screen without its clock, so this borrows its styles and the room page's (create-room/ is
       served at the site root), and adds its own on top -->
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/css/game.css">
  <link rel="stylesheet" href="/css/game-state.css">
  <link rel="stylesheet" href="/solo/css/solo.css">
  <link rel="stylesheet" href="/practice/css/practice.css">

  <script defer src="/shared/toast.js"></script>
  <script defer src="/shared/sfx.js"></script>
  <script defer src="/practice/js/practice.js"></script>
  <script defer src="/solo/js/tiles.js"></script>
  <!-- The room page's music, which follows `view` (see practice.js) -->
  <script defer src="/js/audio.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('Service Worker registered successfully:', registration.scope);
          })
          .catch((error) => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</head>
<body class="game">

  <div class="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <!-- Nothing to lose by leaving, so it doesn't ask -->
  <button class="icon-btn home-btn" id="homeBtn" type="button" aria-label="Back to the home page" title="Back to the home page">🏠</button>
  <button class="icon-btn mute" id="mute-button" type="button" aria-label="Mute sound" aria-pressed="false">🔊</button>


  <div class="game-state show" id="gameState">
    <div class="game-ui">
      <header class="game-header">
        <div class="solo-score" id="solvedPill" aria-live="polite">0 solved</div>
      </header>

      <main class="game-content" id="gameContent">
        <p class="progress" id="progress" hidden><span id="levelLabel">Word 1</span> · <span class="length-label" id="lengthLabel">3 letters</span></p>

        <!-- Until the words are here (practice.js) -->
        <div class="practice-load" id="loadView" role="status">
          <p id="loadText"><span class="spinner" aria-hidden="true"></span>Getting words…</p>
          <button class="btn btn-glass" id="retryBtn" type="button" hidden>Try again</button>
        </div>

        <div class="answer-slots" id="answerSlots" aria-label="Your answer"></div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
        <div class="letter-tiles" id="anagramDisplay" aria-label="Scrambled letters"></div>

        <div class="word-actions">
          <button class="icon-btn" id="shuffleBtn" type="button" aria-label="Shuffle letters" title="Shuffle (Space)">🔄</button>
          <!-- Where solo mode's hint is: shows you the word, then on to the next -->
          <button class="powerup shrug" id="shrugBtn" type="button" aria-label="I don't know - show me the word" title="Show me the word (?)">
            <span class="powerup-icon" aria-hidden="true">🤷</span>
          </button>
          <button class="icon-btn" id="undoBtn" type="button" aria-label="Remove last letter" title="Remove last letter (Backspace)">⌫</button>
        </div>
        <p class="hint">Tap the letters in order, or type them. Stuck? Tap 🤷.</p>

        <!-- Words got at this length: a letter longer after the fifth -->
        <ul class="tier" id="tier" aria-hidden="true"><li></li><li></li><li></li><li></li><li></li></ul>
      </main>
    </div>
  </div>

</body>
</html>
