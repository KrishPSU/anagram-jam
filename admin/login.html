<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#232526">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in | Anagram Jam Admin</title>

  <!-- Favicon (browsers cache these hard - bump ?v= whenever the icon changes) -->
  <link rel="icon" type="image/png" href="/icon-192.png?v=2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/admin/assets/admin.css">

  <script defer src="/admin/assets/login.js"></script>
</head>
<body class="admin">

  <main class="signin">
    <form class="card signin-card" id="signinForm" novalidate>
      <div class="signin-head">
        <div class="brand-tiles" aria-hidden="true"><span class="tile">A</span><span class="tile jam">J</span></div>
        <p class="eyebrow">Anagram Jam</p>
        <h1>Admin</h1>
      </div>

      <!-- For password managers, which file a password under a username -->
      <input class="sr-only" type="text" name="username" autocomplete="username" value="admin" tabindex="-1" aria-hidden="true">

      <label class="signin-label" for="password">Password</label>
      <div class="signin-field">
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus spellcheck="false" maxlength="200">
        <button class="signin-peek" id="peekBtn" type="button" aria-label="Show password" aria-pressed="false">Show</button>
      </div>

      <p class="signin-error" id="signinError" role="alert" hidden></p>

      <button class="btn btn-primary" type="submit" id="signinBtn"><span class="spinner" aria-hidden="true"></span><span class="btn-label">Sign in</span></button>
    </form>

    <a class="signin-back" href="/">← Back to Anagram Jam</a>
  </main>

</body>
</html>
