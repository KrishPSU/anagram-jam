<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin</title>
  
  <!-- Favicon (browsers cache these hard - bump ?v= whenever the icon changes) -->
  <link rel="icon" type="image/png" href="/icon-192.png?v=2">

  <link rel="stylesheet" href="css/main.css">
  <script defer src="/shared/socket.js"></script>
  <script defer src="js/main.js"></script>

  <script src="/socket.io/socket.io.js"></script>

</head>
<body>
  
  <h1 class="title">Anagram Jam | Admin Terminal</h1>

  <div class="counts">
    <div class="count" id="players-count">
      <h2>Players Connected:</h2>
      <p id="player_count_el">0</p>
    </div>

    <div class="count" id="games-count">
      <h2>Games Active:</h2>
      <p id="active_game_count_el">0</p>
    </div>

    <div class="count" id="storage">
      <h2>Rooms Kept In:</h2>
      <p id="storage_el">…</p>
    </div>
  </div>

  <!-- Taking players off the solo leaderboard (a rude name, say). Needs the password set as ADMIN_PASSWORD. -->
  <section class="solo-admin" aria-labelledby="solo_admin_title">
    <h2 id="solo_admin_title">Solo Leaderboard</h2>
    <p class="solo-admin-note">Names with common swear words already show as "Player". Remove takes a player off the board until they play again.</p>
    <form class="solo-admin-form" id="solo_admin_form">
      <input type="password" id="admin_password" placeholder="Admin password" autocomplete="current-password" aria-label="Admin password">
      <button type="submit">Show</button>
    </form>
    <p class="solo-admin-status" id="solo_admin_status" role="status"></p>
    <table class="solo-admin-table" id="solo_admin_table" hidden>
      <thead>
        <tr><th>#</th><th>Name</th><th>Points</th><th>When</th><th></th></tr>
      </thead>
      <tbody id="solo_admin_rows"></tbody>
    </table>
  </section>

</body>
</html>
