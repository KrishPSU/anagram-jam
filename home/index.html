<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#232526">
  <meta name="description" content="Test your word skills and compete with friends!">
  <title>Anagram Jam</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/icon-192.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="/socket.io/socket.io.js"></script>

  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="styles.css">

  <script src="/shared/socket.js" defer></script>
  <script src="/shared/toast.js" defer></script>
  <script src="script.js" defer></script>


  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('Service Worker registered successfully:', registration.scope);
          })
          .catch((error) => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</head>
<body class="home">
  <!-- Letter tiles drifting up behind everything (filled in by script.js) -->
  <div class="drift" id="drift" aria-hidden="true"></div>

  <main class="home-layout">
    <section class="hero">
      <p class="eyebrow">Word party game</p>
      <h1 class="title-tiles" aria-label="Anagram Jam">
        <span class="tile-row" data-word="ANAGRAM" aria-hidden="true"></span>
        <span class="tile-row jam" data-word="JAM" aria-hidden="true"></span>
      </h1>
      <p class="tagline">Race your friends to unscramble 10 words.</p>

      <p class="live" id="liveStats" hidden><i></i><span id="liveText"></span></p>

      <!-- Attract-mode round that plays by itself -->
      <div class="demo" aria-hidden="true">
        <span class="demo-who" id="demoWho">Demo round</span>
        <div class="demo-tiles" id="demoTiles"></div>
        <div class="demo-slots" id="demoSlots"></div>
        <p class="demo-result" id="demoResult"></p>
      </div>
    </section>

    <section class="start">
      <form class="card start-card" id="startForm" novalidate>
        <label class="field-label" for="playerName">Your name</label>
        <input
          type="text"
          id="playerName"
          class="field"
          placeholder="Enter your name"
          maxlength="20"
          autocomplete="nickname"
          enterkeyhint="go"
        >

        <div class="mode" id="chooseMode">
          <button class="btn btn-primary" type="submit" id="createBtn"><span class="spinner" aria-hidden="true"></span><span class="btn-label">Create a room</span></button>
          <button class="btn btn-ghost" type="button" id="showJoinBtn">Join with a code</button>
        </div>

        <div class="mode" id="joinMode" hidden>
          <span class="field-label" id="codeLabel">Room code</span>
          <div class="code-boxes" id="codeBoxes" role="group" aria-labelledby="codeLabel">
            <input class="code-box" type="text" aria-label="Letter 1 of 5" autocomplete="off" autocapitalize="characters" spellcheck="false">
            <input class="code-box" type="text" aria-label="Letter 2 of 5" autocomplete="off" autocapitalize="characters" spellcheck="false">
            <input class="code-box" type="text" aria-label="Letter 3 of 5" autocomplete="off" autocapitalize="characters" spellcheck="false">
            <input class="code-box" type="text" aria-label="Letter 4 of 5" autocomplete="off" autocapitalize="characters" spellcheck="false">
            <input class="code-box" type="text" aria-label="Letter 5 of 5" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go">
          </div>
          <button class="btn btn-primary" type="submit" id="joinBtn"><span class="spinner" aria-hidden="true"></span><span class="btn-label">Join room</span></button>
          <button class="link-btn" type="button" id="backBtn">Create a room instead</button>
        </div>

        <!-- Read out by screen readers while a request is waiting on the server -->
        <p class="sr-only" id="busyStatus" role="status"></p>
      </form>

      <button class="soon" type="button" id="soloBtn">Solo mode <span>Soon</span></button>
    </section>
  </main>

</body>
</html>
