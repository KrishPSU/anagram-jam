<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#232526">
  <meta name="description" content="Race your friends to unscramble words. Free on the App Store, or play at anagramjam.com.">
  <title>Get Anagram Jam</title>

  <!-- What a shared link to this page shows (iMessage and the like) - see /app in index.js -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Anagram Jam">
  <meta property="og:title" content="Anagram Jam: Word Party">
  <meta property="og:description" content="Race your friends to unscramble words. Free on the App Store.">
  <meta property="og:image" content="https://www.anagramjam.com/share.png?v=1">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Anagram Jam: race your friends to unscramble words">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicon (browsers cache these hard - bump ?v= whenever the icon changes) -->
  <link rel="icon" type="image/png" href="/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icon-192.png?v=2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/info/info.css">

  <script defer src="/shared/app.js"></script>
  <!-- PostHog, as on the game pages (see shared/analytics.js) -->
  <script defer src="/shared/config.js"></script>
  <script defer src="/shared/analytics.js"></script>
</head>
<body class="home">
  <a class="icon-btn home-btn" href="/" aria-label="Back to the home page" title="Back to the home page">🏠</a>

  <!-- An iPhone is sent straight to the App Store (see /app in index.js), so this is for everything else -->
  <main class="info-layout">
    <header class="info-head">
      <p class="eyebrow">Anagram Jam</p>
      <h1>Get the app</h1>
    </header>

    <article class="card info-card app-card">
      <img class="app-banner" src="/share.png?v=1" width="1200" height="630" alt="Anagram Jam: race your friends to unscramble words">
      <p>Race your friends to unscramble words, beat your best in Solo, and play a new Daily Jam every day. Free on iPhone, or play right here in your browser.</p>
      <div class="app-actions">
        <a class="btn btn-primary" href="https://apps.apple.com/app/id6828193475">Get it on the App Store</a>
        <a class="btn btn-ghost" href="/">Play in your browser</a>
      </div>
    </article>
  </main>
</body>
</html>
