<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#232526">
  <meta name="robots" content="noindex">
  <title>Signing in | Anagram Jam</title>

  <!-- Favicon (browsers cache these hard - bump ?v= whenever the icon changes) -->
  <link rel="icon" type="image/png" href="/icon-192.png?v=2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    /* Only on screen for a moment, so the page it goes on to just appears rather than sliding in (see theme.css) */
    @view-transition { navigation: none; }

    /* On screen for a moment on the way back from Google or Apple (callback.js), so it has no page of styles of its own */
    .callback {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 16px;
      padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
      text-align: center;
    }

    .callback-card {
      width: min(calc(100vw - 32px), 360px);
      display: grid;
      gap: 16px;
      padding: 24px 20px;
    }

    .callback-text {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 600;
      font-size: 16px;
      line-height: 1.45;
    }
  </style>

  <!-- No service worker here, unlike every other page: nothing should sit between this page and the server while it
       finishes the sign-in. /shared/config.js is for the token (ensurePlayerToken). -->
  <script defer src="/shared/config.js"></script>
  <script defer src="/account/callback.js"></script>
</head>
<body class="home">
  <main class="callback">
    <p class="eyebrow">Anagram Jam</p>
    <div class="card callback-card" role="status" aria-live="polite">
      <p class="callback-text" id="status"><span class="spinner" aria-hidden="true"></span>Finishing sign-in…</p>
      <a class="btn btn-ghost" id="back" href="/" hidden>Back to Anagram Jam</a>
    </div>
  </main>
</body>
</html>
