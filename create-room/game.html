<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#232526">
  <meta name="description" content="Test your word skills and compete with friends!">
  <title>Game Lobby</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/icon-192.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/game-state.css">

  <script defer src="/shared/socket.js"></script>
  <script defer src="/shared/toast.js"></script>
  <script defer src="/shared/sfx.js"></script>
  <script defer src="/shared/players.js"></script>
  <script defer src="js/lobby.js"></script>
  <script defer src="js/timer.js"></script>
  <script defer src="js/game.js"></script>
  <script defer src="js/audio.js"></script>
  <script defer src="js/leaderboard.js"></script>
  <script defer src="js/keyboard.js"></script>

  <script src="/socket.io/socket.io.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('Service Worker registered successfully:', registration.scope);
          })
          .catch((error) => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>

</head>
<body class="lobby">

  <audio id="backgroundMusic" src="/music/anagram-jam-background-music.mp3" autoplay loop muted></audio>
  <audio id="gameMusic" src="/music/what you in joined sample.mp3" loop muted></audio>

  <div class="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <button class="icon-btn mute" id="mute-button" type="button" aria-label="Mute sound" aria-pressed="false">🔊</button>

  <div class="lobby-wrapper" id="lobbyWrapper">
    <div class="floating-shapes">
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
    </div>
    <button id="leave" class="btn btn-danger btn-sm" type="button">Leave</button>

    <header class="lobby-head">
      <p class="eyebrow" id="lobbyEyebrow">Lobby</p>
      <div class="code-tiles" id="roomCode" aria-label="Room code"></div>
      <button class="btn btn-glass btn-sm" id="inviteBtn" type="button">⧉ Copy invite link</button>
    </header>

    <div class="lobby-card card">
      <!-- The spinner goes away on its own: the first status update replaces everything in here -->
      <p class="status" id="waiting" role="status"><span class="spinner" aria-hidden="true"></span>Connecting…</p>
      <div class="players" id="players"></div>
      <button id="readyBtn" class="btn btn-go" type="button" hidden>Start game</button>
    </div>
  </div>

  <!-- 3-2-1 before each game. The server sends the words when it finishes. -->
  <div class="countdown" id="countdown" hidden>
    <p class="eyebrow">Get ready</p>
    <div class="count-num" id="countNum">3</div>
    <button class="btn btn-glass" id="cancelStart" type="button" hidden>Cancel</button>
  </div>


  <div class="game-state" id="gameState">
    <div class="floating-shapes">
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
    </div>

    <div class="game-ui">
      <header class="game-header">
        <div class="leader" id="leaderPill"><span id="currentLeader">First to 10 wins</span></div>
        <div class="timer" id="gameTimer" role="timer" aria-label="Seconds left">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle class="track" cx="24" cy="24" r="21"></circle>
            <circle class="bar" id="timerBar" cx="24" cy="24" r="21"></circle>
          </svg>
          <span id="timerText">30</span>
        </div>
      </header>

      <section class="standing" aria-labelledby="standingTitle">
        <h2 id="standingTitle">Standings</h2>
        <ul class="standing-list" id="standingList">
          <!-- Player standings will be dynamically added here -->
        </ul>
      </section>

      <main class="game-content">
        <p class="progress"><span id="levelLabel">Word 1 of 10</span> · <span id="pointsDisplay">0 pts</span></p>
        <div class="powerups">
          <div class="powerup" id="powerupHint" title="Hint (3 available)">
            <span class="powerup-icon">💡</span>
            <span class="powerup-count" id="hintCount">3</span>
          </div>
          <div class="powerup" id="powerupSkip" title="Skip (1 available)">
            <span class="powerup-icon">⏭️</span>
            <span class="powerup-count" id="skipCount">1</span>
          </div>
        </div>

        <div class="answer-slots" id="answerSlots" aria-label="Your answer"></div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
        <div class="letter-tiles" id="anagramDisplay" aria-label="Scrambled letters"></div>

        <div class="word-actions">
          <button class="icon-btn" id="undoBtn" type="button" aria-label="Remove last letter" title="Remove last letter (Backspace)">⌫</button>
          <button class="icon-btn" id="shuffleBtn" type="button" aria-label="Shuffle letters" title="Shuffle (Space)">🔄</button>
        </div>
        <p class="hint">Tap the letters in order, or type them.</p>

        <aside class="levels" aria-label="Levels">
          <ul class="level-list">
            <li class="level-circle" aria-label="Level 1"></li>
            <li class="level-circle" aria-label="Level 2"></li>
            <li class="level-circle" aria-label="Level 3"></li>
            <li class="level-circle" aria-label="Level 4"></li>
            <li class="level-circle" aria-label="Level 5"></li>
            <li class="level-circle" aria-label="Level 6"></li>
            <li class="level-circle" aria-label="Level 7"></li>
            <li class="level-circle" aria-label="Level 8"></li>
            <li class="level-circle" aria-label="Level 9"></li>
            <li class="level-circle" aria-label="Level 10"></li>
          </ul>
        </aside>
      </main>
    </div>
  </div>

</body>
</html>
